version: 1
scope: proof_mvp_v1
laws:
  - id: GL-001
    name: composition_requires_complete_singular_closure_record
    when: composition
    requires:
      - closure_record_exists
      - existence_closed
      - designation_closed
      - possibility_closed
      - identity_closed
      - relational_closed
      - weight_closed
      - ready_for_composition
  - id: GL-002
    name: judgement_requires_proposition_communication_ambiguity_trace
    when: judgement
    requires:
      - proposition_closed
      - communicative_closed
      - ambiguity_resolved_or_suspended
      - trace_chain_valid
  - id: GL-003
    name: composition_requires_minimum_role_tokens
    when: composition
    requires:
      - role_distribution_min_tokens_2
