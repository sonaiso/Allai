version: 1
scope: proof_mvp_v1
policy:
  mandatory_gates: minimum_transition_conditions_only
  deferred_layers_default: non_blocking
laws:
  - id: GL-001
    name: composition_requires_complete_unified_singular_closure_record
    when: composition
    requires:
      - closure_record_exists
      - existence_closed
      - designation_closed
      - possibility_closed
      - identity_closed
      - relational_closed
      - weight_closed
      - logical_classificatory_closed
      - unified_closure_closed
      - ready_for_composition
    optional_non_gating:
      - singular_deferred_analysis_available
  - id: GL-002
    name: judgement_requires_proposition_communication_ambiguity_trace
    when: judgement
    requires:
      - proposition_closed
      - communicative_closed
      - ambiguity_resolved_or_suspended
      - trace_chain_valid
  - id: GL-003
    name: composition_requires_minimum_role_tokens
    when: composition
    requires:
      - role_distribution_min_tokens_2
  - id: GL-004
    name: judgement_requires_world_model_closure
    when: judgement
    requires:
      - world_model_closed
  - id: GL-005
    name: rejection_gate_requires_verb_frame_and_enriched_concepts
    when: rejection_gate
    requires:
      - agent_operator_result_present
      - enriched_concepts_present
  - id: GL-006
    name: metaphor_gate_requires_conflict_detection
    when: metaphor_gate
    requires:
      - rejection_gate_passed_or_conflict_flagged
