version: 1
scope: proof_mvp_v1
policy:
  no_jump_scope: mandatory_transition_ranks_only
invariants:
  - id: NJ-001
    name: no_composition_before_complete_unified_singular_closure_record
    forbidden_if_missing:
      - closure_record_exists
      - ready_for_composition
  - id: NJ-002
    name: no_judgement_before_proposition_and_communication
    forbidden_if_missing:
      - proposition_closed
      - communicative_closed
      - ambiguity_resolved_or_suspended
      - trace_chain_valid
  - id: NJ-003
    name: required_constitutional_events_must_be_ordered
    forbidden_if_missing:
      - ordered_required_trace_events
  - id: NJ-004
    name: no_jump_between_singular_ranks
    forbidden_if_missing:
      - adjacency_existence_to_designation
      - adjacency_designation_to_possibility
      - adjacency_possibility_to_identity
      - adjacency_identity_to_relational
      - adjacency_relational_to_weight
      - adjacency_weight_to_logical_classificatory
      - adjacency_logical_classificatory_to_unified_closure
  - id: NJ-005
    name: no_judgement_before_world_model_closure
    forbidden_if_missing:
      - world_model_extracted
      - world_model_closed
  - id: NJ-006
    name: no_rejection_before_agent_operator
    forbidden_if_missing:
      - agent_operator_gate_applied
  - id: NJ-007
    name: no_metaphor_before_conflict_detection
    forbidden_if_missing:
      - rejection_gate_applied
