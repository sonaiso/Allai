name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: pip install flake8 mypy coverage

      - name: Lint
        run: flake8 src/ tests/ --max-line-length=120

      - name: Type check
        env:
          PYTHONPATH: src
        run: mypy src/ --ignore-missing-imports --config-file=pyproject.toml

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: |
          coverage run -m unittest discover -s tests -p 'test_*.py' -v
          coverage report --fail-under=85
